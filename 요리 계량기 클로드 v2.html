<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요리 계량 변환기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: linear-gradient(135deg, #ffe9d6 0%, #fff6ec 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 440px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 32px 28px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header .icon { font-size: 52px; line-height: 1; }
  .header h1 { font-size: 24px; color: #d9741f; margin-top: 8px; }
  .header p { font-size: 13px; color: #999; margin-top: 6px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #555;
    margin-bottom: 7px;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid #e3d3c2;
    border-radius: 10px;
    background: #fffdfb;
    outline: none;
  }
  select:focus, input:focus { border-color: #f0a35e; }
  .row { display: flex; gap: 10px; }
  .row .amount { flex: 2; }
  .row .unit { flex: 1; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #f0a35e;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
  }
  button:hover { background: #e08a3e; }
  .result {
    margin-top: 24px;
    padding: 20px;
    background: #fff6ec;
    border: 1.5px dashed #f0a35e;
    border-radius: 12px;
    min-height: 70px;
    text-align: center;
    color: #a05a1a;
    font-size: 15px;
    line-height: 1.9;
  }
  .result .big { font-size: 18px; font-weight: 700; color: #d9741f; }
  .result .placeholder { color: #bbb; font-size: 14px; }
  .error { color: #c0392b; font-size: 14px; }
  /* ✅수정3: 경고 메시지 스타일 추가 */
  .warn { color: #c0392b; font-size: 13px; margin-top: 6px; }
  /* ✅수정3: 기준 데이터 박스 스타일 추가 */
  .standard {
    margin-top: 18px;
    padding: 14px 16px;
    background: #fbf3ea;
    border-radius: 10px;
    font-size: 12px;
    color: #8a6a4a;
    line-height: 1.8;
  }
  .standard b { color: #d9741f; }
  .note { margin-top: 14px; font-size: 11px; color: #bbb; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">🥄</div>
      <h1>요리 계량 변환기</h1>
      <p>g · ml 을 큰술 · 작은술 · 컵 단위로 변환해요</p>
    </div>

    <div class="field">
      <label for="ingredient">재료 선택</label>
      <!-- ✅수정1: 재료별 기준 단위를 괄호로 표시 -->
      <select id="ingredient" onchange="syncUnit()">
        <option value="sugar">설탕 (무게·g)</option>
        <option value="salt">소금 (무게·g)</option>
        <option value="flour">밀가루 (무게·g)</option>
        <option value="soy">간장 (부피·ml)</option>
        <option value="water">물 (부피·ml)</option>
      </select>
    </div>

    <div class="field">
      <label for="amount">수치 입력</label>
      <div class="row">
        <input class="amount" type="number" id="amount" placeholder="예: 24" min="0" step="any">
        <select class="unit" id="unit">
          <option value="g">g</option>
          <option value="ml">ml</option>
        </select>
      </div>
    </div>

    <button onclick="convert()">변환하기</button>

    <div class="result" id="result">
      <span class="placeholder">재료와 수치를 입력하고 변환하기를 눌러주세요.</span>
    </div>

    <!-- ✅수정3: 변환 기준 데이터 화면 표시 -->
    <div class="standard">
      📏 <b>변환 기준</b> (평균값)<br>
      1큰술 = 15ml · 1작은술 = 5ml · 1컵(종이컵) = 180ml<br>
      설탕 12g · 소금 15g · 밀가루 8g · 간장 15ml · 물 15ml <span style="color:#bbb;">(각 1큰술 기준)</span>
    </div>

    <p class="note">
      ※ 재료별 평균 밀도(고정 기준값)를 사용합니다.<br>
      가루의 굵기·수분 함량에 따라 실제 무게는 달라질 수 있어요.
    </p>
  </div>

<script>
  const DATA = {
    sugar: { name: "설탕",   perTbsp: 12, unit: "g"  },
    salt:  { name: "소금",   perTbsp: 15, unit: "g"  },
    flour: { name: "밀가루", perTbsp: 8,  unit: "g"  },
    soy:   { name: "간장",   perTbsp: 15, unit: "ml" },
    water: { name: "물",     perTbsp: 15, unit: "ml" }
  };

  const TSP_PER_TBSP = 3;    // 1큰술 = 3작은술
  const TBSP_ML = 15;        // 1큰술 부피 ≈ 15ml
  const CUP_ML = 180;        // 종이컵 1컵 ≈ 180ml

  function fmt(n) {
    return Number.isInteger(n) ? n.toString() : n.toFixed(1);
  }

  // ✅수정1: 재료를 바꾸면 단위 선택을 기준 단위로 자동 맞춤
  function syncUnit() {
    const key = document.getElementById("ingredient").value;
    document.getElementById("unit").value = DATA[key].unit;
  }

  function convert() {
    const key = document.getElementById("ingredient").value;
    const amount = parseFloat(document.getElementById("amount").value);
    const inputUnit = document.getElementById("unit").value;
    const resultEl = document.getElementById("result");
    const info = DATA[key];

    // 입력 검증
    if (isNaN(amount) || amount <= 0) {
      resultEl.innerHTML = '<span class="error">0보다 큰 숫자를 입력해주세요.</span>';
      return;
    }

    // ✅수정1: 단위 검증 — 재료 기준 단위와 다르면 경고하고 중단
    if (inputUnit !== info.unit) {
      resultEl.innerHTML =
        '<span class="error">⚠️ ' + info.name + '은(는) \'' + info.unit +
        '\' 단위로 재는 재료예요.<br>단위를 ' + info.unit + '(으)로 바꿔주세요.</span>';
      return;
    }

    const tbsp = amount / info.perTbsp;
    const tsp  = tbsp * TSP_PER_TBSP;
    const cup  = (tbsp * TBSP_ML) / CUP_ML;

    resultEl.innerHTML =
      '<div><span class="big">' + info.name + ' ' + fmt(amount) + inputUnit + '</span> 은(는)</div>' +
      '<div>큰술 약 <b>' + fmt(tbsp) + '</b>스푼</div>' +
      '<div>작은술 약 <b>' + fmt(tsp) + '</b>스푼</div>' +
      '<div>종이컵 약 <b>' + fmt(cup) + '</b>컵</div>';
  }

  // ✅수정2: Enter 키로도 변환 실행 (기본 동작 차단 추가)
document.getElementById("amount").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();   // ← 폼 제출·새로고침 같은 기본 동작 막기
    convert();            // 검증 포함된 변환 함수 실행
  }
});
  // 처음 화면이 뜰 때 재료 기준 단위로 맞춰두기
  syncUnit();
</script>
</body>
</html>
